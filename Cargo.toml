[package]
name = "crcli"
version = "0.1.0"
edition = "2021"

[dependencies]
cloudreve-sdk-api = { git = "https://github.com/k88936/cloudreve-sdk-rs.git", rev = "577da283f857d0d8fc821a67e24d7c2c4fa9f5b2" }
cloudreve-sdk-uploader = { git = "https://github.com/k88936/cloudreve-sdk-rs.git", rev = "577da283f857d0d8fc821a67e24d7c2c4fa9f5b2" }
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
anyhow = "1"
futures = "0.3"
toml = "1.1.4"
serde = { version = "1", features = ["derive"] }
indicatif = "0.18.6"
walkdir = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dirs = "6.0.0"
