[package]
name = "crcli"
version = "0.1.0"
edition = "2021"

[dependencies]
cloudreve-sdk-api = "0.1.0"
cloudreve-sdk-uploader = "0.1.0"
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
anyhow = "1"
toml = "1.1.4"
serde = { version = "1", features = ["derive"] }
indicatif = "0.18.6"
walkdir = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dirs = "6.0.0"
